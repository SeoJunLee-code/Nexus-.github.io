<!doctype html>
<html lang="ko" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Log — NEXUS</title>
<meta name="description" content="NEXUS 연구 일지: H1 과 Paper 5 의 질문·실험·분석·예상 밖 결과·수정·반증·다음 질문을 날짜순으로. 각 항목은 원본 파일과 연결됩니다.">
<meta name="theme-color" content="#03050d">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/nexus.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nexus-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
</head>
<body data-root="../" data-page="log">
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header id="nav"><noscript><nav class="wrap"><a href="../">NEXUS</a> · <a href="../h1/">H1</a> · <a href="../paper5/">Paper 5</a></nav></noscript></header>

<main id="main">
  <section class="page-hero" aria-labelledby="log-title">
    <div class="wrap">
      <div class="crumb"><a href="../">← Home</a><span>/</span><span>Log</span></div>
      <div class="kicker v">Research Log · Mission Log</div>
      <h1 class="h-display" id="log-title" style="font-size:clamp(32px,4vw,52px);margin-top:10px">연구 일지</h1>
      <p class="q">결정, 실패, 수정까지 날짜순으로. 날짜는 결과 파일의 <code>created</code> 값 또는 Drive 파일 생성·수정 시각이며, 각 항목에 근거 파일을 붙였습니다.</p>
      <div class="meta-row" id="log-meta"></div>
    </div>
  </section>

  <section class="rsec" id="journal"><div class="wrap">
    <div class="grid g-12-5" style="align-items:start">
      <div>
        <div class="log-filters no-print" role="group" aria-label="일지 필터">
          <div class="seg" id="f-proj" role="radiogroup" aria-label="프로젝트"><button role="radio" aria-pressed="true" aria-checked="true" data-v="">전체</button><button role="radio" aria-pressed="false" aria-checked="false" data-v="h1">H1</button><button role="radio" aria-pressed="false" aria-checked="false" data-v="paper5">Paper 5</button></div>
          <div class="chips" id="f-type" aria-label="유형"></div>
          <div style="display:flex;gap:8px"><button class="btn sm ghost" type="button" id="expand-all">모두 펼치기</button><button class="btn sm ghost" type="button" id="collapse-all">모두 접기</button></div>
        </div>
        <div id="log-days" style="margin-top:18px" aria-live="polite"></div>
      </div>
      <aside class="panel log-side">
        <h3 style="margin-top:0">유형별</h3>
        <div id="type-summary"></div>
        <h3>전환점</h3>
        <p class="faint" style="font-size:12.5px;margin-top:0">예상 밖 결과 · 수정 · 반증 · 다음 질문</p>
        <ol class="tl" id="turning"></ol>
        <p class="faint" style="font-size:12px;margin-top:14px">원자료: <a href="../data/timeline.json" download>data/timeline.json</a> (build_data.py 생성)</p>
      </aside>
    </div>
  </div></section>
</main>
<footer id="footer"></footer>
<script src="../assets/js/core.js" defer></script>
<script src="../assets/js/components.js" defer></script>
<script src="../assets/js/log.js" defer></script>
</body>
</html>
